services:
  db:
    image: postgis/postgis:16-3.4
    container_name: putnam-trashmap-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-putnam_trashmap}
      POSTGRES_USER: ${POSTGRES_USER:-putnam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-putnam}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: putnam-trashmap-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
      TIME_ZONE: ${TIME_ZONE:-America/Chicago}
      POSTGRES_DB: ${POSTGRES_DB:-putnam_trashmap}
      POSTGRES_USER: ${POSTGRES_USER:-putnam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-putnam}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      INVITE_CODE: ${INVITE_CODE:-}
    volumes:
      - ./:/app
    ports:
      - "${WEB_PORT:-8000}:8000"

volumes:
  postgis_data:
