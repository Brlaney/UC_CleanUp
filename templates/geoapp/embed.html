<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UC CleanUp — Live Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  #embed-map { width: 100%; height: 100%; }
  .embed-cta {
    position: absolute;
    bottom: 10px;
    right: 10px;
    z-index: 1000;
    background: #0d5e97;
    color: #fff;
    text-decoration: none;
    padding: 0.45rem 0.9rem;
    border-radius: 6px;
    font-family: system-ui, sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .embed-cta:hover { background: #0b4e7e; }
  .embed-legend {
    position: absolute;
    bottom: 10px;
    left: 10px;
    z-index: 1000;
    background: rgba(255,255,255,0.92);
    border-radius: 6px;
    padding: 0.4rem 0.65rem;
    font-family: system-ui, sans-serif;
    font-size: 0.75rem;
    color: #1a2940;
    line-height: 1.7;
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; border: 1px solid rgba(0,0,0,0.2); }
</style>
</head>
<body>
<div id="embed-map"></div>
<a class="embed-cta" href="https://uc-cleanup.com/" target="_blank" rel="noopener">Report a site &rarr;</a>
<div class="embed-legend">
  <span class="legend-dot" style="background:#db5a26"></span>Pending
  <br>
  <span class="legend-dot" style="background:#ccb10f"></span>In Progress
  <br>
  <span class="legend-dot" style="background:#1f944f"></span>Cleaned
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function () {
  var map = L.map("embed-map", {
    center: [36.1627, -85.5016],
    zoom: 11,
    zoomControl: true,
    attributionControl: true,
  });

  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png", {
    maxZoom: 20,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: "abcd",
  }).addTo(map);

  var COLORS = { PENDING: "#db5a26", IN_PROGRESS: "#ccb10f", CLEANED: "#1f944f" };

  function loadMarkers() {
    var b = map.getBounds();
    var bbox = b.getWest() + "," + b.getSouth() + "," + b.getEast() + "," + b.getNorth();
    fetch("/api/features/?bbox=" + bbox + "&status=PENDING,IN_PROGRESS,CLEANED")
      .then(function(r) { return r.json(); })
      .then(function(data) {
        markersLayer.clearLayers();
        (data.features || []).forEach(function(f) {
          var p = f.properties;
          var c = f.geometry.coordinates;
          var color = COLORS[p.status] || COLORS.PENDING;
          var m = L.circleMarker([c[1], c[0]], {
            radius: 7, fillColor: color, color: "#fff", weight: 2, fillOpacity: 0.9,
          });
          m.bindPopup(
            "<strong>" + (p.title || "Trash Site") + "</strong><br>" +
            "<small>" + (p.status || "") + (p.severity ? " &middot; " + p.severity : "") + "</small>" +
            "<br><a href='https://uc-cleanup.com/?focus_id=" + p.id + "' target='_blank'>View on UC CleanUp &rarr;</a>"
          );
          m.addTo(markersLayer);
        });
      }).catch(function() {});
  }

  var markersLayer = L.layerGroup().addTo(map);
  map.on("moveend", loadMarkers);
  loadMarkers();
}());
</script>
</body>
</html>
