{% extends "base.html" %}

{% block title %}Forgot Username - District 3 CleanUp{% endblock %}

{% block content %}
<section class="auth-wrap">
    <h1>Forgot Your Username?</h1>
    <p>Enter the email address on your account and we'll send your username.</p>
    <form method="post" class="auth-form">
        {% csrf_token %}
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        <button class="btn btn-primary" type="submit">Send Username</button>
    </form>
    <p class="auth-link"><a href="{% url 'login' %}">&larr; Back to log in</a></p>
</section>
{% endblock %}
